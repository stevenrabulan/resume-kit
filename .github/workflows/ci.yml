name: CI

# Two jobs on purpose. macOS is the platform this kit was built and verified on.
# Ubuntu exercises the Linux browser paths in scripts/setup.sh and
# scripts/txt_to_pdf.js, which were written from knowledge rather than tested.
# See docs/STATUS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report the browser CI found
        run: |
          for candidate in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/usr/bin/google-chrome" \
            "/usr/bin/google-chrome-stable" \
            "/usr/bin/chromium" \
            "/usr/bin/chromium-browser"; do
            if [ -x "$candidate" ]; then
              echo "found: $candidate"
              exit 0
            fi
          done
          echo "No Chrome-based browser on this runner image."
          echo "The PDF step below will fail. Fix the runner, not the script."
          exit 1

      - name: setup.sh passes every check
        run: bash scripts/setup.sh --agent

      - name: Render the example resume to PDF
        run: |
          IN="examples/opportunities/Northwind Traders/Alex Doe - Resume - Backend Engineer - Northwind Traders.txt"
          OUT="$RUNNER_TEMP/ci-render.pdf"
          node scripts/txt_to_pdf.js "$IN" "$OUT" | tee "$RUNNER_TEMP/render.log"
          [ -s "$OUT" ] || { echo "PDF is empty"; exit 1; }
          head -c 4 "$OUT" | grep -q '%PDF' || { echo "Output is not a PDF"; exit 1; }
          # An ATS reads text, so the page must carry fonts rather than a raster
          # image. This check is what would notice if that ever changed.
          grep -aq 'Font' "$OUT" || { echo "No font objects in the PDF"; exit 1; }
          # The example is a two-page resume. Page breaks that push a job onto
          # a third page, or a page count the script cannot read, fail here.
          grep -q '(2 pages)' "$RUNNER_TEMP/render.log" || { echo "Expected 2 pages"; exit 1; }
          echo "Rendered $(wc -c < "$OUT") bytes"

      - name: txt_to_pdf.js tests pass
        run: bash scripts/txt_to_pdf.test.sh

      - name: check-clean.sh tests pass
        run: bash scripts/check-clean.test.sh

      - name: No personal data in tracked or untracked files
        run: bash scripts/check-clean.sh --allow-no-terms

      - name: setup.sh left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "setup.sh modified tracked files:"
            git status --porcelain
            exit 1
          fi
